<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaDB Vector Explorer — CyberRAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .explorer-header {
            padding: 1.5rem 2rem;
            background: rgba(8, 11, 17, 0.95);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
        }

        .explorer-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            margin: 2rem 0;
        }

        .explorer-stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-cyan);
            font-family: var(--font-code);
        }

        .search-bar-wrapper {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-bar-wrapper input {
            flex: 1;
            min-width: 280px;
            padding: 0.85rem 1.25rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-bar-wrapper input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .chunk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .chunk-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all var(--transition-fast);
        }

        .chunk-card:hover {
            border-color: var(--accent-cyan);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 240, 255, 0.12);
        }

        .chunk-meta-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .chunk-id-badge {
            font-family: var(--font-code);
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(0, 240, 255, 0.12);
            color: var(--accent-cyan);
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .chunk-source-tag {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-emerald);
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }

        .chunk-page-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .chunk-text-box {
            font-family: var(--font-code);
            font-size: 0.82rem;
            color: var(--text-secondary);
            background: rgba(8, 11, 17, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.85rem;
            line-height: 1.5;
            max-height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 1rem;
        }

        .chunk-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Modal styling */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--accent-cyan);
            border-radius: var(--radius-lg);
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25);
        }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            font-family: var(--font-code);
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-wrap;
            background: rgba(8, 11, 17, 0.9);
        }
    </style>
</head>
<body class="cyber-theme">

    <header class="explorer-header">
        <div class="nav-brand" onclick="window.location.href='/'">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <span class="brand-name">ChromaDB <span class="accent-text">Vector Explorer</span></span>
        </div>
        <div class="nav-actions">
            <button class="btn btn-sm btn-outline" onclick="loadVectorData()">🔄 Refresh Data</button>
            <a href="/" class="btn btn-sm btn-glow">← Back to CyberRAG Chat</a>
        </div>
    </header>

    <main class="container">
        <!-- Hero Stats -->
        <div class="explorer-stats">
            <div class="explorer-stat-card">
                <span class="stat-label">Total Indexed Chunks</span>
                <span class="stat-num" id="stat-total-chunks">--</span>
            </div>
            <div class="explorer-stat-card">
                <span class="stat-label">Unique Documents</span>
                <span class="stat-num" id="stat-unique-docs">--</span>
            </div>
            <div class="explorer-stat-card">
                <span class="stat-label">Collection Name</span>
                <span class="stat-num" style="font-size: 1.1rem; margin-top: 0.3rem;" id="stat-collection">cybersecurity_knowledge</span>
            </div>
            <div class="explorer-stat-card">
                <span class="stat-label">Storage Engine</span>
                <span class="stat-num" style="font-size: 1.1rem; margin-top: 0.3rem;">ChromaDB Persistent (SQLite)</span>
            </div>
        </div>

        <!-- Search Bar & Filter -->
        <div class="search-bar-wrapper">
            <input type="text" id="explorer-search" placeholder="Search vector chunks by keyword, chunk ID, or document name..." oninput="filterChunks(this.value)">
        </div>

        <!-- Chunks Grid -->
        <div id="chunks-grid" class="chunk-grid">
            <div class="kb-loading">Loading vector store entries from ChromaDB...</div>
        </div>
    </main>

    <!-- Full Text Inspection Modal -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h3 id="modal-title" style="font-size: 1.1rem;">Chunk Detail Inspection</h3>
                    <span id="modal-meta" style="font-size:0.8rem; color:var(--text-muted)">--</span>
                </div>
                <button class="btn-icon" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-text"></div>
        </div>
    </div>

    <script>
        let allChunks = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadVectorData();
        });

        async function loadVectorData() {
            const grid = document.getElementById("chunks-grid");
            grid.innerHTML = `<div class="kb-loading">Loading vector store entries from ChromaDB...</div>`;

            try {
                const res = await fetch("/api/vector-db/explorer");
                if (!res.ok) throw new Error("Failed to fetch vector data");
                const data = await res.json();

                allChunks = data.chunks || [];

                document.getElementById("stat-total-chunks").innerText = data.total_chunks || 0;
                document.getElementById("stat-unique-docs").innerText = data.stats?.unique_documents || 0;
                document.getElementById("stat-collection").innerText = data.stats?.collection_name || "cybersecurity_knowledge";

                renderChunkGrid(allChunks);
            } catch (err) {
                grid.innerHTML = `<div class="kb-loading" style="color:var(--accent-red)">Failed to load vector store data: ${err.message}</div>`;
            }
        }

        function renderChunkGrid(chunks) {
            const grid = document.getElementById("chunks-grid");
            if (!chunks || chunks.length === 0) {
                grid.innerHTML = `<div class="kb-loading">No vector chunks match your search.</div>`;
                return;
            }

            grid.innerHTML = chunks.map((chunk, idx) => {
                const textPreview = escapeHtml(chunk.text);
                return `
                    <div class="chunk-card">
                        <div>
                            <div class="chunk-meta-header">
                                <span class="chunk-id-badge">ID: ${escapeHtml(chunk.id)}</span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${chunk.char_length} chars</span>
                            </div>
                            <div class="chunk-source-tag">📄 ${escapeHtml(chunk.source)}</div>
                            <div class="chunk-page-tag">Section: ${escapeHtml(chunk.page)}</div>
                            <div class="chunk-text-box">${textPreview}</div>
                        </div>
                        <div class="chunk-footer">
                            <span>Index #${idx + 1}</span>
                            <button class="btn btn-sm btn-outline" onclick="inspectChunk(${idx})">🔍 View Full Text</button>
                        </div>
                    </div>
                `;
            }).join("");
        }

        function filterChunks(query) {
            const term = (query || "").toLowerCase().trim();
            if (!term) {
                renderChunkGrid(allChunks);
                return;
            }

            const filtered = allChunks.filter(c => 
                c.id.toLowerCase().includes(term) ||
                c.source.toLowerCase().includes(term) ||
                c.page.toString().toLowerCase().includes(term) ||
                c.text.toLowerCase().includes(term)
            );
            renderChunkGrid(filtered);
        }

        function inspectChunk(index) {
            const chunk = allChunks[index];
            if (!chunk) return;

            document.getElementById("modal-title").innerText = `Chunk ID: ${chunk.id}`;
            document.getElementById("modal-meta").innerText = `Source: ${chunk.source} | Section: ${chunk.page} | ${chunk.char_length} Characters`;
            document.getElementById("modal-text").innerText = chunk.text;
            document.getElementById("modal-backdrop").classList.add("active");
        }

        function closeModal() {
            document.getElementById("modal-backdrop").classList.remove("active");
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
